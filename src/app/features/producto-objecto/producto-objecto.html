 @if(producto){
  <mat-card appearance="raised" routerLink="/tienda/{{producto.id}}" class="producto-card">
      <img src="{{producto.foto}}" class="rounded-t-lg" alt="imagen de {{producto.nombre}}">
      <mat-card-content class="mt-2">
        <h2 class="text-sm font-semibold uppercase">{{producto.nombre}}</h2>
        <p class="font-light">{{producto.precio| currency  }}</p>

      </mat-card-content>
      <mat-card-actions (click)="$event.stopPropagation()">
         <button mat-stroked-button class="w-full" (click)="carritoService.agregarobjetoalCarrito(producto)">
          <mat-icon>add_shopping_cart</mat-icon>
          Agregar al Carrito
         </button>
      </mat-card-actions>
    </mat-card>

 }
