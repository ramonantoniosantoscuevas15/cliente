<div>
  <h3 class="text-3xl text-center pt-6 mb-3">Filtros</h3>
  <mat-divider></mat-divider>
  <div class="flex p-4">
    <div class="w-1/2">
      <h4 class="font-semibold text-xl text-primary">Marcas
        <mat-selection-list [(ngModel)]="marcasSeleccionadas" [multiple]="true">
          @for (marca of productoservices.marcas; track $index) {
            <mat-list-option [value]="marca">{{marca}}</mat-list-option>
          }
        </mat-selection-list>
      </h4>
    </div>
    <div class="w-1/2">
      <h4 class="font-semibold text-xl text-primary">Tipos
        <mat-selection-list [(ngModel)]="tiposSeleccionados" [multiple]="true">
          @for (tipo of productoservices.tipos; track $index) {
            <mat-list-option [value]="tipo">{{tipo}}</mat-list-option>
          }
        </mat-selection-list>
      </h4>
    </div>
  </div>
  <div class="flex justify-end p-4">
    <button mat-flat-button (click)="aplicarfiltro()">Aplicar filtro</button>

  </div>
</div>
