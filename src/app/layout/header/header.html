<header class="shadow-md p-3 w-full max-h-20 fixed top-0 z-50 bg-white">
  <div class="flex align-middle items-center justify-between max-w-screen-2xl mx-auto">
    <img routerLink="/" src="/images/logo.png" alt="app logo" class="max-h-16">
    <nav class="flex gap-3 my-2 uppercase text-2xl">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact:true}">Home</a>
      <a routerLink="tienda" routerLinkActive="active">Tienda</a>
      <a routerLink="error" routerLinkActive="active">Errores</a>
    </nav>
    <div class="flex gap-3 align-middle">
      <a routerLink="/carrito" routerLinkActive="active" matBadge="{{carritoservice.objetototal()}}"
        matBadgeSize="large" class="custom-badge nt-2 mr-2">
        <mat-icon>shopping_cart</mat-icon>
      </a>
      @if(cuentaservice.usuarioreciente()){
      <button mat-button [matMenuTriggerFor]="menu">
        <mat-icon>arrow_drop_down</mat-icon>
        <span>{{cuentaservice.usuarioreciente()?.email}}</span>
      </button>
      }@else {
      <button routerLink="/cuenta/login" mat-stroked-button>Login</button>
      <button routerLink="/cuenta/registro" mat-stroked-button>Register</button>

      }


    </div>

  </div>
</header>
@if (ocupadoService.loading) {
<mat-progress-bar mode="indeterminate" class="fixed top-20 z-50"></mat-progress-bar>
}

<mat-menu #menu="matMenu" class="px-5">
  <button mat-menu-item class="px-3" routerLink="/carrito">
    <mat-icon>shopping_cart</mat-icon>
    Mi Carrito
  </button>
  <button mat-menu-item class="px-3" routerLink="/ordenes">
    <mat-icon>history</mat-icon>
    Mis Ordenes
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item class="px-3" (click)="logout()">
    <mat-icon>logout</mat-icon>
    Logout
  </button>
</mat-menu>
