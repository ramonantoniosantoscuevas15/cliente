@if(producto){
<section class="py-8">
  <div class="max-w-screen-2xl px-4 mx-auto">
    <div class="grid grid-cols-2 gap-8">
      <div class="max-w-xl mx-auto">
        <img class="w-full" src="{{producto.foto}}" alt="producto imagen">
      </div>
      <div>
        <h1 class="text-2xl font-semibold text-gray-900">{{producto.nombre}}</h1>
        <p>Tienes {{cantidadCarrito}} de este producto en tu Carrito de compras</p>
        <div class="mt-4 items-center gap-4">
          <p class="text-2xl font-extrabold text-gray-900">
            {{producto.precio | currency}}
          </p>
        </div>
        <div class="flex gap-4 mt-6">
          <button [disabled]="cantidad === cantidadCarrito" (click)="actualizarCarrito()" mat-flat-button
            class="min-h-14">
            <mat-icon>shopping_cart</mat-icon>
            {{obtenerbuttontext()}}
          </button>
          <mat-form-field appearance="outline" class="flex">
            <mat-label>Cantidad:</mat-label>
            <input matInput min="0" [(ngModel)]="cantidad" type="number">

          </mat-form-field>
        </div>
        <mat-divider></mat-divider>
        <p class="mt-6 text-gray-500">
          {{producto.descripcion}}
        </p>
      </div>
    </div>
  </div>

</section>
}
