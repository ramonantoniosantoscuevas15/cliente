<div class="flex mt-32 gap-6">
  <div class="w-3/4">
    <mat-stepper (selectionChange)="onStateChange($event)" #stepper class="bg-white border-gray-200 shadow-sm">
      <mat-step label="Direccion">
        <div id="direccion-elemento"></div>
        <div class="flex justify-end mt-1">
          <mat-checkbox
          [checked]="guradardireccion"
          (change)="guardardirreccioncheckbox($event)"
          >
            guardar direccion
          </mat-checkbox>
        </div>
        <div class="flex justify-between mt-6">
          <button routerLink="/tienda" mat-stroked-button>Continuar Comprando</button>
          <button matStepperNext mat-stroked-button>Siguiente</button>
        </div>
      </mat-step>
      <mat-step label="Compra">
        <app-compra-entrega></app-compra-entrega>
        <div class="flex justify-between mt-6">
          <button matStepperPrevious mat-stroked-button>Atras</button>
          <button matStepperNext mat-stroked-button>Siguiente</button>
        </div>
      </mat-step>
      <mat-step label="Pago">
        Pago Formulario
        <button matStepperPrevious mat-stroked-button>Atras</button>
          <button matStepperNext mat-stroked-button>Siguiente</button>
      </mat-step>
      <mat-step label="Confirmacion">
        Resumen Formulario
      </mat-step>

    </mat-stepper>
  </div>
  <div class="w-1/4">
    <app-orden-resumen></app-orden-resumen>

  </div>

</div>
