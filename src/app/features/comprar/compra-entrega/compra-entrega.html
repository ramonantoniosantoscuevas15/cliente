<div class="w-full">
  <mat-radio-group [value]="carritoservice.entregaseleccionada()?.id"
  (change)="ActualizarMetodoEntrega($event.value)"
  class="grid grid-cols-2 gap-4">
    @for (metodo of compraservices.metodoentregas; track metodo.id) {
    <label class="p-3 border border-gray-200 cursor-pointer w-full h-full hover:bg-blue-500">
      <mat-radio-button class="w-full h-full"
      [checked]="carritoservice.entregaseleccionada() === metodo"
      [value]="metodo">
        <div class="flex flex-col w-full h-full">
          <strong>{{metodo.nombre}}  - {{metodo.precio | currency}}</strong>
          <span class="text-sm">{{metodo.descripcion}}</span>

        </div>

      </mat-radio-button>
    </label>
    }
  </mat-radio-group>

</div>
